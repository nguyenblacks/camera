name: camera_app
description: "Swavoti Camera — computational photography app."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.1
  image: ^4.5.4
  gal: ^2.3.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  speech_to_text: ^7.0.0
  open_file: ^3.3.2
  google_mlkit_face_detection: ^0.11.1
  google_mlkit_selfie_segmentation: ^0.8.0
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon.png"

flutter_native_splash:
  color: "#000000"
  image: "assets/icon.png"
  android_12:
    image: "assets/icon.png"
    color: "#000000"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
